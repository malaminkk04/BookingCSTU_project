<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="CS Room Booking System" />
  <title>CS Room Booking</title>
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>

  <div class="login-page">

    <!-- LEFT -->
    <div class="left-section">

      <div class="logo-wrapper">
        <img src="logo.png" alt="logo" class="logo" />
      </div>

      <div class="booking-wrapper">
        <h1>BOOKING ROOM</h1>
        <div class="booking-line"></div>
        <p>
          Learning Center 2
          <br />
          Thammasat University
          (Rangsit Campus)
        </p>
      </div>

    </div>

    <!-- RIGHT -->
    <div class="right-section">

      <div class="login-box">

        <div class="login-title">LOGIN</div>

        <div class="form-wrapper">

          <label for="studentId">USERNAME</label>
          <input type="text" id="studentId" name="studentId" placeholder="enter your username" title="username" />

          <label for="password">PASSWORD</label>
          <input type="password" id="password" name="password" placeholder="enter your password" title="password" />

          <div class="button-wrapper">
            <button id="loginBtn">ENTER</button>
          </div>

        </div>

      </div>

    </div>

  </div>

  <script src="js/login.js"></script>
</body>
</html>
